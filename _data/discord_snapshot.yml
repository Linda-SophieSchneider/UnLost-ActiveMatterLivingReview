    title: Native Intel Mac Build of VC3D Released
    summary: A participant created a native Intel‑Mac version of VC3D, packaging it as a DMG for macOS 13.3+
      (AVX2). By using conda‑forge dependencies the build time dropped from ~15 h to ~45 min, fixing code‑signing
      and enabling real OpenMP multithreading, reducing render time from 20.7 s to 15.5 s (≈25% faster)
      and cutting default RAM usage to one‑third. Links to release and benchmarks provided.
    relevance: 2
    links:
    - url: https://github.com/antonietox/vc3d-intel-mac/releases/latest
      label: github.com/antonietox/vc3d-intel-mac
    - url: https://github.com/antonietox/vc3d-intel-mac
      label: github.com/antonietox/vc3d-intel-mac
    discord: https://discord.com/channels/1079907749569237093/1565156071012696115
  - channel: unrolling-vc3d
    date: '2026-10-26'
    title: Adding NumPy‑only TIFXYZ ↔ OBJ conversion to vesuvius.tifxyz
    summary: A participant proposes integrating a pure NumPy conversion pair for TIFXYZ and OBJ files
      into the vesuvius.tifxyz package, replacing external VC3D calls. The plan would reuse the three
      existing Python OBJ writers, preserving vertex order, UV mapping, and area‑weighted normals. Scale
      handling for reverse conversion is questioned, with a suggestion to require an explicit scale flag.
      The change aims to streamline in‑process workflow.
    relevance: 2
    links:
    - url: https://github.com/ScrollPrize/villa/pull/2365
      label: github.com/ScrollPrize/villa
    - url: https://github.com/ScrollPrize/villa/issues/1319
