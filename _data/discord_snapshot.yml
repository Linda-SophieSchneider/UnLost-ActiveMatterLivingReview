  - channel: show-and-tell
    date: '2026-11-17'
    title: Fiber-direction based layer separation and automatic meshing
    summary: A participant used CT fibre orientation to distinguish papyrus plies, training a small U‑Net
      to track layers. The method automatically separates, numbers, meshes and unwraps layers across multiple
      tiles, achieving 99.6% mesh coverage versus 82% for the official mesh. Using the ink_9 µm model,
      the mesh scored +0.73 against human labels (official mesh +0.80). The pipeline runs in a 12.7 GB
      Colab and yields a large labeled dataset for future training.
    relevance: 3
    links:
