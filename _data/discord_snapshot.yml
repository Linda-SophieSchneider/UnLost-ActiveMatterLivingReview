    date: '2026-07-13'
    title: Optimizing remote chunk storage for VC3D fiber data
    summary: A participant highlighted the high metadata overhead of S3 when handling millions of files
      and suggested larger chunk sizes (e.g., 64³) or sharding with Zarr v3 to reduce latency. Alternatives
      like packing everything into a zip were debated, noting that interactive fiber tracing requires
      random access, so larger chunks help some workflows but hurt others. The discussion recommended
      increasing chunk size to about 160 KiB, locally subdividing chunks, and converting the remote cache
      to a Zarr‑compatible format for streaming.
