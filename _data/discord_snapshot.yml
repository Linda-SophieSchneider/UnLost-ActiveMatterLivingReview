  - channel: robots
    date: '2026-10-25'
    title: Downscale warning added to read_tifxyz loader
    summary: 'A participant highlighted a pending pull request that introduces a warning—and optional
      correction—when the read_tifxyz function loads an open-data normalized mesh lacking the original_volume_downscale
      flag, preventing points from being displaced by several centimetres. The change references issue
      #1522.'
    relevance: 2
    links:
