    title: Auto‑generated surface candidates for PHerc1451
    summary: An auto‑generated set of 57 tifxyz surface candidates for the PHerc1451 scroll (2.4 µm scan)
      was released (v3). After fibre and self‑overlap checks, 38 surfaces covering roughly 220 cm² passed;
      the rest are stored separately. Winding numbers were cross‑checked, and one erroneous unit was removed.
      These are provisional surfaces without verified winding or ink detection, offered under CC BY‑NC 4.0.
