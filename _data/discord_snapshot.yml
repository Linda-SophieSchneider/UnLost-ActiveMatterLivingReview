    title: Lossy voxel quantization and rANS compression reduces volume size
    summary: 'A participant experimented with slight lossy quantization on a 2 µm volume, achieving 5–6×
      reduction at level 0, 3–4× at level 1, and 2–3× at deeper levels, with visually indistinguishable
      results. Proposed pipeline: round voxels to nearest multiple of 5, histogram‑based axis delta encoding,
      then rANS. Discussed trade‑offs between lossless and lossy streaming, noting existing codecs decode
      only 50–100 MiB/s, and considering video codecs with hardware acceleration.'
