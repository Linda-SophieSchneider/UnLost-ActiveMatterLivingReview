    title: Fiber Continuity Evaluator Shows Mixed Results on Papyrus Traces
    summary: A participant created a validator that compares AFV output to hand‑labelled papyrus fibers.
      On two preregistered cubes, the raw AFV model covered more of the labelled fibers, while the older
      spline/gap tracer retained longer uninterrupted fiber chains at similar coverage. An added dynamic‑programming
      adjustment failed its improvement test (primary gate down ‑0.748%), so its default upgrade was halted.
      The native export keeps original IDs and frames.
