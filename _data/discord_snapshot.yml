    date: '2026-11-02'
    title: Tri‑mesh ingestion and thermoforming for scroll unwrapping
    summary: A participant added support for importing tri‑mesh PLY files into the sheet store and rendering
      them, enabling full‑sheet visualization and animated 3D views. They noted texture mapping on tri‑meshes
      is memory‑heavy and that rasterizing introduces singularities. A thermoforming approach—inflating
