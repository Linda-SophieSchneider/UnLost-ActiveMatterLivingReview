    summary: A participant released Velend, a Blender add‑on that uses GPU rendering of VC3D omezarr data,
      replacing the previous TIFF hack. Features include streaming chunk downloads, UV‑editor rendering,
      tiffxyz import, shared cache with VC3D, sculpting with 3D textures, orientation handling via CW/ACW
      winding, PNG export, and texture‑painting for annotations. Versions 0.3.0 and 0.4.0 were published
      in September 2026.
