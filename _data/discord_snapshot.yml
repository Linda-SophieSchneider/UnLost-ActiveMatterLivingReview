    date: '2026-11-23'
    title: Positive-Unlabelled Ink Training with ScribblePU
    summary: A new workflow lets users draw 1‑pixel scribbles on 9 µm scans to create conservative pseudo‑labels.
      Fine‑tuning with these traces yields a model that recovers up to 97 % of the performance of full‑mask
