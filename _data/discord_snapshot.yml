    title: Label‑free QC tool for mesh tilt and offset estimation
    summary: A participant described a MIT‑licensed, GitHub‑hosted tool that computes mesh tilt and normal
      offset by analyzing texture shifts between adjacent layers of vc_render_tifxyz stacks. The method
      parallels the offset‑to‑nearest‑sheet regression used on scroll 0139 and could provide a label‑free
      offset field with an uncertainty map for prior or validation use. Questions were raised about inter‑layer
      phase correlation, availability of review tags, and classification of QC reports.
    relevance: 2
