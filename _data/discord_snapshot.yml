    date: '2026-11-02'
    title: New Segmentation Growth Methods Integrated into Villa
    summary: 'A recent pull request adds two segmentation growth techniques to the Villa tool: streamline
      integration using structure tensors and a projection‑based growth that follows the normal’s tangent
      while removing the normal component. Both can operate on raw CT or prediction volumes without requiring
      normal‑grid data, and are accessible via a right‑click menu or manual grow widget. They improve
      results in areas where normal‑grid growth fails.'
