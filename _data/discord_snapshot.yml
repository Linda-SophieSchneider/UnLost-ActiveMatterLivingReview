    title: Dense Spiral-Winding Datasets and Snapping Challenges for Herculaneum Scrolls
    summary: A participant highlighted the difficulty of globally snapping scroll segments and linked
      a consistent‑snap repository. Another shared meshes (run through reader‑v3) and a preview video
      of levels 64‑98 rendered at‑g 3. The community discussed an iterative probabilistic diffeomorphic
      unrolling idea and announced a new release containing dense spiral‑fit windings (w010‑w129) for
      PHerc121 (z 6900‑8400) and PHerc1545 (z 5300‑6800) in tif‑xyz format, useful for PHerc0125 research.
