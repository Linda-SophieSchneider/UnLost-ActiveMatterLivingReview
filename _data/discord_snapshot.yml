    date: '2026-11-23'
    title: Unified Multi-Source Ink Label Dataset for Herculaneum Papyrus
    summary: A participant released a consolidated ink‑label dataset covering 1,609 entries (≈238 000 mm²
      papyrus, ≈19 000 mm² confirmed ink) with quality scores 1–5. It merges IR‑photographed fragments,
      hand‑traced packs, competition tracings, 1 µm scan maps, and model labels onto a uniform 9.362 µm
      grid, providing 21 CT layers per entry (~54 GB). Reported checks show 99.9 % ink and 100 % background
      accuracy for IR fragments, enabling quality‑threshold training.
