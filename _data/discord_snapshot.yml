  - channel: show-and-tell
    date: '2026-08-04'
    title: Chunk caching reduces inference data traffic in Vesuvius pipeline
    summary: A participant found that the inference path rereads identical chunks, inflating traffic up
      to 17×. A draft fix adds an on‑disk LRU cache, cutting data transferred from 402.7 MB to 62.9 MB
      for repeated patches. Further benchmarks show traversal order (e.g., Morton) can reduce traffic
      more than larger caches, with a 4 GiB cache plus optimal ordering achieving only 1.19× overhead.
      The DiskCachedStore wrapper implements this cache.
