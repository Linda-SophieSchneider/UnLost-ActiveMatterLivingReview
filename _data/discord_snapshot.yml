    date: '2026-11-14'
    title: Global Fiber Winding Solver for Automated Unwrapping
    summary: A participant released a global fiber winding graph solver that takes predicted fiber volumes
      and lasagna normal volumes to infer perpendicular and parallel constraints, estimate winding distances,
      and compute integer winding numbers per fiber. The CUDA‑accelerated IRLS solver processes a Paris‑4
      dataset in 40 seconds; the full pipeline runs in about one hour, with a 40‑minute UV solve. On scroll
      332 it achieved a median winding error of one turn, zero for most windings, without manual input.
      Whole‑scroll AFV‑v2 fiber sets for all 20 prize‑eligible scrolls were shared via HuggingFace.
