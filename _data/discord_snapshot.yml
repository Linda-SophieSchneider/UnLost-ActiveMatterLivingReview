  - channel: show-and-tell
    date: '2026-11-17'
    title: 'HerculeX: Fast Modular Pipeline for Large‑Scale Papyrus Unwrapping'
    summary: A participant presented HerculeX, a full‑stack toolkit that converts raw CT scans into printable
      text surfaces. It builds sheet geometry using structure‑tensor normals, assigns integer windings
      via an L1 min‑cost‑flow (network simplex), and flattens patches isometrically. On an M1 Pro it processes
      about 10,000 cm² in 2–3 hours, recovering 50–70 % of a scroll. The system is modular, Apple‑silicon
      native, and can be ported to CUDA, with ongoing work on global fitting and meshing of crushed areas.
    relevance: 3
