    date: '2026-10-05'
    title: VC3D macOS build and coarse‑mask mode speed‑up
    summary: A participant asked how to compile VC3D natively on an Apple Silicon Mac (M5 Max, 128 GB),
      noting the documentation only mentions Docker. Another shared a CMakeUserPresets.json file to aid
      the build. Later a pull request introduced an optional --coarse‑mask‑mode for grow_track_graph,
      which skips a final one‑cell erosion, delivering about 98 % of the reference coverage of spacing‑5
      at spacing 10 while halving flattening CPU time, with modest distortion.
