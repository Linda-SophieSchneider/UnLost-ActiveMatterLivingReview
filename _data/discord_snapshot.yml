  - channel: show-and-tell
    date: '2026-11-21'
    title: Screening Results and Crack Test for Unread Herculaneum Scroll Bands
    summary: A participant processed 57 bands across 19 unread scrolls (≈3,000 windings) using 312 GPU
      hours. The output lists each band’s location, best‑scoring row, and its classification. An empty
      label means no text was found by the lane’s own model or Reader v3; a new 211 model may revisit
      some. A crack‑test ratio (≈1 for real text, ≥2 for cracks) and orientation data are provided, and
      claim imaging runs in ~10 min on 16 CPU cores. Two additional bands (PHerc1545, z 5300‑6800 with
      129 windings; PHerc1218, z 6900‑8400 with 120 windings) were added, both empty for Reader v3.
    relevance: 3
    links:
