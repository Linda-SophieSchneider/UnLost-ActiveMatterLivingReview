    title: Recency bias and acceptance test failures in model-driven workflow
    summary: A participant described five AI model errors caught by human intuition about physical plausibility,
      such as impossible fractional letters per line and unrealistic line spacing. Errors arose from overweighting
      recent inputs, misreading statistical medians as measurements, and flawed acceptance tests. One
      pre‑registered test exposed a design flaw; another test was vacuous until rewritten. The note stresses
      the need for robust validation against real‑world constraints.
