    date: '2026-10-31'
    title: Optimized Automated Unwrapping Pipeline for PHerc1667
    summary: A participant described an improved unwrapping pipeline applied to a scroll (≈8 cm × 90 cm)
      with ground‑truth data. The method grows octagonal patches (180–500 voxels), prioritises visit order
      by alignment, removes bad patches, and refines with a ball‑and‑spring model. Simulated annealing
      runs 10 k iterations on ~52 k patches (30–40 mutated per step) at 40‑voxel mesh, taking 19 h on
      8 threads (64 GB RAM) and requiring additional annealing time. Cost function now penalises surface
      area, 3‑D/2‑D inconsistencies, and stretching.
