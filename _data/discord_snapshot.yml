  - channel: show-and-tell
    date: '2026-11-06'
    title: Validating GrowPatch Mesh Alignment for PHerc0125
    summary: A participant described a workflow to confirm that a GrowPatch mesh follows the intended
      sheet face of scroll PHerc0125. The method samples raw CT intensity along mesh normals from –8 to +8
      voxels, checks for a peak near zero and compares shifted copies; a pass required the mesh to be
      within ~3 voxels (≈9 µm) of the sheet. Normal flips affected 16‑48% of points, leaving only a 1.7 cm²
      clean patch, and a layer tilt of 3.6° was observed. Offset errors of 2 voxels had minimal impact
      on ink predictions.
    relevance: 3
