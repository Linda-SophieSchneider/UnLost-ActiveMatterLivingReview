  - channel: show-and-tell
    date: '2026-11-21'
    title: Rust-based AFV Tracer Accelerates CT-to-AVF for Herculaneum Scrolls
    summary: A participant released a Rust port called fibrs that replicates a participant's AVF spline
      generator, runs on an NVIDIA GPU without PyTorch, and claims about a 44× speedup (800 s vs 9 h 45 min)
      for three 512‑plane bands. Whole‑scroll processing now takes hours. Datasets for 20 prize‑eligible
      scrolls (233.6 M fibres, 145.6 km, 448 GB) are uploaded to HuggingFace; raw fibers are provided,
      with optional cleaning.
