    title: Spiral Tracks and Fits for Four First Letters Scrolls
    summary: A participant generated spiral tracks for a 1,500‑slice band of each of four First Letters
      scrolls using the same extractor settings as published tracks. The spiral fit ran 8,000 steps per
      scroll, reducing loss by about 96%, and three middle windings were rendered showing papyrus fibres.
      Ink detection on these windings found no letters. Whole‑length tracks (53 bands, ~96 M tracks, ~110 GB)
      were also produced but not released.
