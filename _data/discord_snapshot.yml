    date: '2026-11-16'
    title: Optimized Full-Height Spiral Fitting for Low‑VRAM GPUs
    summary: The author introduced three options in fit_spiral.py—pool offload to host RAM, aggressive
      garbage‑collection policy, and freeing optimizer state before export—that cut peak GPU memory by
      up to 44 % (21.2 → 11.9 GB) and enable whole‑height spiral fits on 16 GB cards. On a 32 GB GPU all
      21 scrolls now fit at 32‑voxel resolution (previously 18) and 20 at 16‑voxel. A 16 GB card handles
      18 of 21 scrolls. Scroll PHerc0268 runs with median 15 GB usage.
    relevance: 3
