    title: Resume and Estimate Flags Reduce Whole-Scroll Inference Overhead
    summary: A participant reported that processing a 1.34 TB scroll at 11 MB/s caused 41 TB of traffic
      and up to 43 days I/O. New command‑line options ––resume and ––estimate were added to the villa
      pipeline. ––resume stores progress in a manifest and allows safe continuation, rejecting mismatched
      configurations. ––estimate predicts patches, chunks, data volume and runtime before execution. A
      cache test showed no speed gain due to network variance.
