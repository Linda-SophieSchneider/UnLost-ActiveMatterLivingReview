      label: github.com/ScrollPrize/villa
    discord: https://discord.com/channels/1079907749569237093/1564016964588933272
  - channel: show-and-tell
    date: '2026-10-21'
    title: Scroll Core Viewer for Herculaneum Papyrus
    summary: A participant released a public web viewer that visualizes the interior core of Herculaneum
      scroll 175A, showing grain‑like texture rendered in 3D, and includes additional scrolls. The code
      is open‑source on GitHub Pages.
    relevance: 2
    links: []
    discord: https://discord.com/channels/1079907749569237093/1562277051929464952
  - channel: robots
    date: '2026-10-18'
    title: CPU Renderer Replicates VC3D Voxel Output
    summary: A participant showed that a CPU‑based renderer reproduces the VC3D results on the PHerc0813
      scan (9.362 µm voxel size) with 99.603 % voxel agreement across a 31‑layer grid, and no difference
      exceeding one grey level in 289,894,051 comparisons. A one‑layer shift control dropped agreement
      to 3.569 %. Earlier tests gave 99.68 % agreement on 8.64 µm data.
    relevance: 2
    links:
    - url: https://github.com/rodriguescarson/eligible-scroll-atlas/blob/evidence/window-layer-drift/renderer-check/ongrid.md
      label: github.com/rodriguescarson/eligible-scroll-atlas
    discord: https://discord.com/channels/1079907749569237093/1561411409244594237
  - channel: show-and-tell
    date: '2026-10-12'
    title: Find_patches tool updates and halo fix for PHerc0500P2
    summary: 'A participant added three find_patches updates: input flag with non‑zero exit when no patches
      (#1969); fix for patches falling into padded volume, correcting four of six samples (#1970); and
      docs correction for loss name and mask handling (#2036). Additional patches fix a halo artifact,
      reducing phantom share on PHerc0500P2 from 63.9 % to 2.3 % (#2082), and prevent the MemoryEfficientSoftDiceLoss
      from exploding to ~1e12 by applying sigmoid (#2062). Implemented with Claude Code.'
    relevance: 2
