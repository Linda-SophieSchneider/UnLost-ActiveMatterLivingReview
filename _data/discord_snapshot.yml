    title: Scroll Data Audit Finds Metadata Mismatch and Prediction Issues
    summary: An open‑source audit tool compared the canonical metadata catalog to actual Zarr arrays,
      confirming exact multiscale pyramids and flagging a shape error in Scroll 5 (z‑dimension 20616 vs
      20820, off by 204 slices). Another participant reported that surface predictions often label sheet
      on zero‑value CT voxels (30/36 scrolls >10%, median 38%, pooled 39.7%). The author suggests adding
