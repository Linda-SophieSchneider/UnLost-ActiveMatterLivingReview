    title: HerculeX Unwrapping Dataset for 21 Herculaneum Scrolls
    summary: A participant shared a HuggingFace dataset containing unwrapped sheets for 21 Herculaneum
      scrolls generated with the HerculeX pipeline. Running full inference on all scrolls is computationally
      costly; suggestions to use Vast AI instances (e.g., 5090 GPU for $0.5) were discussed, with reported
      costs of $20 for processing 19 scrolls, $50 per terabyte of data, and $750 spent over two months.
      The dataset was updated with the latest commit.
