    date: '2026-09-04'
    title: VC3D cache format migration and shared download
    summary: A participant reported that VC3D creates both legacy "0" and new "level_0" cache directories,
      causing confusion when trying to share on‑demand downloads with the vesuvius Python package. The
      team explained that the old cache stored decoded files with altered extensions, while the new format
      mirrors the remote Zarr directly. Plans were discussed to drop legacy support, simplify per‑project
      cache handling, and address an open‑files limit crash.
