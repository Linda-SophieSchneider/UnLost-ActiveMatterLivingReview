  - channel: unrolling-vc3d
    date: '2026-11-16'
    title: PHerc0125 Mesh Overlap and Intermediate Winding Export
    summary: A participant reported a 75.5 cm² GrowPatch surface for PHerc0125 showing flat central fibers
      and petal‑like edges, questioning whether they stem from flattening or segmentation. Another participant
      described loading 62 TIFXYZ meshes (full‑resolution voxel coordinates, 9.362 µm, grid scale 0.05)
      where windows overlap by ~200 slices; each mesh covers one spiral winding within a ±400‑slice (800‑voxel)
      window. Overlaps are expected, no global 2D parameterization exists, and stitching would leave seams.
      The fitting routine computes 127 windings per window but only every 20th was exported; the author
      plans to export every 5th winding up to w100 without refitting.
    relevance: 3
    links:
