  - channel: show-and-tell
    date: '2026-11-03'
    title: Graph‑cut based snapping of labels and meshes to papyrus surfaces
    summary: An MIT‑licensed tool moves approximate recto‑surface labels and VC3D meshes onto the papyrus
      face using only CT data. Points are shifted along their normals, scored by a step‑edge and learned
      profile, and an exact graph cut enforces smoothness while outputting confidence flags. Reported
      results include 88% of 100 test cubes returned within 1 voxel (vs 57% uncorrected), 92% blind preference
      for snapped labels, and mesh accuracy improvements from 70% to 93% correct side and 69% to 94% within
      1 voxel.
