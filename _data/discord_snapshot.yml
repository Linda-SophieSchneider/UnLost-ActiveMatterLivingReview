    summary: A participant reported that the flatboi tool crashes on macOS when processing real segments
      due to a threading bug in OpenBLAS 0.3.33; setting OMP_NUM_THREADS=1 or applying a pull‑request
      that updates OpenBLAS resolves the issue. Another contribution demonstrated a spiral‑fit approach
