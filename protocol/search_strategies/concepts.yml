# Single source of truth for the search. `amlr search` renders each block into
# per-source syntax and writes dated <source>-<YYYY-MM-DD>.txt records next to this file.
# Status: DRAFT (to be peer-reviewed with PRESS 2015 before freezing).
# Logic: (object AND method) OR composite_phrases
# Scope (narrowed 2026-11-23): papyri that are read or made readable (letters, Greek script,
# writers), everything on the Herculaneum papyri, and virtual unwrapping of rolled, folded or
# damaged documents.

